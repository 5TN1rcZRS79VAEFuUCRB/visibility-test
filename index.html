<!doctype html>
<meta charset="utf-8">
<title>Visibility test</title>
<style>
  body { font: 14px monospace; margin: 16px; background: #111; color: #ddd; }
  h2 { font-size: 15px; margin: 20px 0 6px; }
  #status { font-size: 16px; }
  .bad { color: #f66; }
  .good { color: #6d6; }
  #hover { display: inline-block; padding: 12px; border: 1px solid #666; }
  #hover.on { background: #264; }
</style>
<div id="status"></div>

<h2>Breakage checks (run with this window focused)</h2>
<button id="run">Run again</button>
<div id="checks"></div>
<p>Manual: <input id="inp" placeholder="type, then click away"> <span id="inpmsg"></span></p>
<p>Manual: <span id="hover">hover me: turns green, back to normal when you move off</span></p>
<p>Manual: <button id="popup">Open popup &amp; check it is patched</button> <span id="popupmsg"></span></p>

<h2>Detections</h2>
<p>DETECTED = the script's disguise failed. GAP = a path the script never covers; these can fire even when it is working.</p>
<div id="log"></div>
<script>
  // Beacon every line to the local server (python http.server logs the request path), so the
  // page's results are readable without a browser. Harmless 404 if no server is listening.
  const report = (msg) => { try { new Image().src = '/report?' + encodeURIComponent(msg); } catch {} };
  report('PING');
  const line = (where, cls, text) => {
    const d = document.createElement('div');
    d.className = cls;
    d.textContent = new Date().toLocaleTimeString() + '  ' + text;
    document.getElementById(where).prepend(d);
    report(text);
  };
  const log = (msg) => line('log', 'bad', 'DETECTED: ' + msg);
  const gap = (msg) => line('log', 'bad', 'GAP (script does not cover this): ' + msg);

  // Events and handler properties.
  document.addEventListener('visibilitychange', () => log('visibilitychange -> ' + document.visibilityState));
  document.onvisibilitychange = () => log('onvisibilitychange handler');
  window.addEventListener('blur', () => log('window blur'));
  window.addEventListener('focus', () => log('window focus'));
  window.onblur = () => log('onblur handler');
  document.addEventListener('mouseleave', () => log('mouseleave (left page)'));
  document.addEventListener('mouseout', (e) => { if (!e.relatedTarget) log('mouseout (left window)'); });
  document.addEventListener('mouseover', (e) => { if (!e.relatedTarget) log('mouseover (came back into window)'); });

  // A same-origin iframe has its own untouched copy of the browser APIs.
  const frame = document.createElement('iframe');
  frame.style.display = 'none';
  document.body.append(frame);
  const realm = frame.contentWindow;
  // A second iframe reached only via window[1], which skips the contentWindow getter.
  document.body.append(Object.assign(document.createElement('iframe'), { style: 'display:none' }));
  const realm2 = window[1];
  // A third iframe inserted via innerHTML on an already-connected node. The script wraps
  // appendChild/insertBefore/append/etc. but NOT innerHTML, so this frame's realm is never
  // patched. Read it via its window index so the (wrapped) contentWindow getter can't patch it.
  const holder = document.createElement('div');
  document.body.append(holder);
  holder.innerHTML = '<iframe style="display:none"></iframe>';
  const realm3 = window[window.length - 1];
  // A fourth iframe with srcdoc: patched at insertion, then its initial about:blank navigates to a
  // new document. If the browser gives that document a fresh realm, the patches are gone. Read it
  // via its window index, again so the contentWindow getter can't re-patch it.
  const sdIndex = window.length;
  const sd = Object.assign(document.createElement('iframe'), { style: 'display:none', srcdoc: '<p>srcdoc' });
  document.body.append(sd);
  const realm4 = () => window[sdIndex];
  const iframeHidden = () => Object.getOwnPropertyDescriptor(realm.Document.prototype, 'hidden').get.call(document);
  const iframeFocus = () => realm.Document.prototype.hasFocus.call(document);

  // Signs that the APIs were tampered with.
  const protoGet = Object.getOwnPropertyDescriptor(Document.prototype, 'hidden').get;
  const native = (f) => /\[native code\]/.test(Function.prototype.toString.call(f));
  const nativeViaIframe = (f) => /\[native code\]/.test(realm.Function.prototype.toString.call(f));
  const tamper = {
    'own hidden property on document': !!Object.getOwnPropertyDescriptor(document, 'hidden'),
    'hidden getter not native': !native(protoGet),
    'hidden getter wrong name': protoGet.name !== 'get hidden',
    'hasFocus not native': !native(document.hasFocus),
    'toString not native': !native(Function.prototype.toString),
    'webkitHidden exists (Firefox has none)': 'webkitHidden' in document,
    'hidden getter not native (checked via iframe)': !nativeViaIframe(protoGet),
    'hidden getter from another realm': Object.getPrototypeOf(protoGet) !== Function.prototype,
    'contentWindow getter not native': !native(Object.getOwnPropertyDescriptor(HTMLIFrameElement.prototype, 'contentWindow').get),
    'hidden getter not native (checked via window[1])': !/\[native code\]/.test(realm2.Function.prototype.toString.call(protoGet)),
  };
  const vgetter = Object.getOwnPropertyDescriptor(Document.prototype, 'visibilityState').get;
  Object.assign(tamper, {
    'visibilityState getter not native': !native(vgetter),
    'visibilityState getter wrong name': vgetter.name !== 'get visibilityState',
    'visibilityState getter from another realm': Object.getPrototypeOf(vgetter) !== Function.prototype,
    'visibilityState getter not native (checked via iframe)': !nativeViaIframe(vgetter),
  });
  // The script replaces these with fakes; confirm each still looks native and same-realm.
  const faked = ['setTimeout', 'setInterval', 'clearTimeout', 'clearInterval', 'requestAnimationFrame', 'cancelAnimationFrame'];
  if (window.requestIdleCallback) faked.push('requestIdleCallback', 'cancelIdleCallback');
  for (const name of faked) {
    const f = window[name];
    tamper[name + ' not native'] = !native(f);
    tamper[name + ' from another realm'] = Object.getPrototypeOf(f) !== Function.prototype;
  }
  // Fakes must match the WebIDL arity of the natives they replace.
  for (const [obj, name, len] of [
    [window, 'setTimeout', 1], [window, 'setInterval', 1], [window, 'clearTimeout', 0], [window, 'clearInterval', 0],
    [window, 'requestAnimationFrame', 1], [window, 'cancelAnimationFrame', 1], [Document.prototype, 'hasFocus', 0],
    [Node.prototype, 'appendChild', 1], [Node.prototype, 'insertBefore', 2], [Node.prototype, 'replaceChild', 2],
    [Element.prototype, 'append', 0], [Element.prototype, 'insertAdjacentElement', 2],
  ]) tamper[name + '.length is ' + obj[name].length + ', native is ' + len] = obj[name].length !== len;
  // Natives throw on a wrong `this`; a fake that ignores its receiver doesn't.
  const throwsOn = (f, ...args) => { try { f.call({}, ...args); return false; } catch { return true; } };
  Object.assign(tamper, {
    'hidden getter accepts a non-Document this': !throwsOn(protoGet),
    'visibilityState getter accepts a non-Document this': !throwsOn(vgetter),
    'hasFocus accepts a non-Document this': !throwsOn(Document.prototype.hasFocus),
    'setTimeout accepts a non-Window this': !throwsOn(setTimeout, () => {}),
    'requestAnimationFrame accepts a non-Window this': !throwsOn(requestAnimationFrame, () => {}),
  });
  for (const [name, found] of Object.entries(tamper)) if (found) log('tampering visible: ' + name);
  sd.addEventListener('load', () => {
    if (!/\[native code\]/.test(realm4().Function.prototype.toString.call(protoGet))) log('tampering visible: hidden getter not native (checked via srcdoc frame)');
  });

  // A native timer/rAF callback has only its own frame on the stack; a JS-driven fake leaves its
  // dispatcher frames under it. (Firefox async-stack lines contain '*' and are skipped.)
  const callerFrames = () => new Error().stack.split('\n').filter(l => /:\d+:\d+/.test(l) && !l.includes('*')).length - 1;
  setTimeout(() => { const n = callerFrames(); if (n > 1) log('setTimeout callback has ' + n + ' frames on its stack'); }, 0);
  requestAnimationFrame(() => { const n = callerFrames(); if (n > 1) log('requestAnimationFrame callback has ' + n + ' frames on its stack'); });

  // Timing fingerprints, measured while focused. setTimeout(fn, 0) from a fresh task fires within
  // ~1ms natively; a tick-driven fake averages half a tick. Native setInterval keeps its schedule;
  // a fake that reschedules from fire time drifts.
  {
    const ch = new MessageChannel();
    let n = 0, sum = 0;
    ch.port1.onmessage = () => {
      const t = performance.now();
      setTimeout(() => {
        sum += performance.now() - t;
        if (++n < 10) ch.port2.postMessage(0);
        else if (sum / n > 4) log('setTimeout(fn, 0) averages ' + (sum / n).toFixed(1) + 'ms');
      }, 0);
    };
    ch.port2.postMessage(0);
  }
  {
    let ticks = 0;
    const t0 = performance.now();
    const iv = setInterval(() => {
      if (++ticks < 40) return;
      clearInterval(iv);
      const took = performance.now() - t0;
      if (took > 2200) log('setInterval drift: 40 x 50ms ticks took ' + Math.round(took) + 'ms');
    }, 50);
  }

  // Background tabs pause animation frames and slow timers.
  let lastFrame = performance.now();
  const frameLoop = (t) => {
    if (t - lastFrame > 1000) log('animation frames paused ' + Math.round(t - lastFrame) + 'ms');
    lastFrame = t;
    requestAnimationFrame(frameLoop);
  };
  requestAnimationFrame(frameLoop);
  let lastTick = performance.now();
  setInterval(() => {
    const now = performance.now();
    if (now - lastTick > 900) log('100ms timer took ' + Math.round(now - lastTick) + 'ms');
    lastTick = now;
  }, 100);

  // Gaps: paths the script does not patch. These can fire while the script is active.
  const hiddenLeak = (report, label, getWin) => {
    let prev = false;
    setInterval(() => {
      const h = !!getWin()?.document.hidden;
      if (h && !prev) report(label + ' reports hidden=true (real visibility leaked)');
      prev = h;
    }, 500);
  };
  // The innerHTML-made frame is now patched via the wrapped innerHTML setter, so a hidden=true
  // leak here is a real failure. (Needs manual backgrounding; can't fire headless.)
  hiddenLeak(log, 'innerHTML-created frame', () => realm3);
  // The srcdoc frame was inserted via append, which the script claims to cover.
  hiddenLeak(log, 'srcdoc frame', realm4);
  // Losing window focus also blurs the focused element, and focus stays on it. The script only
  // hides window-level blur. (Focus the input above, then switch away.)
  document.addEventListener('focusout', (e) => setTimeout(() => {
    if (document.activeElement === e.target) gap('focused element blurred but kept focus (window lost focus)');
  }, 0));
  // Chrome records each visibility change in the performance timeline.
  if (PerformanceObserver.supportedEntryTypes?.includes('visibility-state')) {
    new PerformanceObserver((list) => {
      for (const e of list.getEntries()) if (e.name === 'hidden') gap('performance timeline has a visibility-state "hidden" entry');
    }).observe({ type: 'visibility-state', buffered: true });
  }
  // Page Lifecycle: Chrome freezes long-backgrounded tabs and may discard them.
  for (const ev of ['freeze', 'resume']) document.addEventListener(ev, () => gap('page lifecycle ' + ev + ' event'));
  if (document.wasDiscarded) gap('document.wasDiscarded is true');
  // requestIdleCallback is now driven off the clock, so it should not be throttled when hidden.
  // A long delay here is a real failure. (Needs manual backgrounding; can't fire headless.)
  let lastIdle = performance.now();
  const idleProbe = () => {
    const n = performance.now();
    if (n - lastIdle > 3000) log('requestIdleCallback delayed ' + Math.round(n - lastIdle) + 'ms');
    lastIdle = n;
    requestIdleCallback(idleProbe);
  };
  if (window.requestIdleCallback) requestIdleCallback(idleProbe);

  let lastStatus = '';
  setInterval(() => {
    const s = 'hidden=' + document.hidden + '  visibilityState=' + document.visibilityState + '  hasFocus=' + document.hasFocus()
      + '  | via iframe: hidden=' + iframeHidden() + '  hasFocus=' + iframeFocus()
      + '  | innerHTML frame (unpatched): hidden=' + realm3.document.hidden;
    document.getElementById('status').textContent = s;
    if (s !== lastStatus) { lastStatus = s; report('STATUS ' + s); }
  }, 500);

  // Breakage checks: normal page behavior the script must not block.
  const check = (name, ok) => {
    line('checks', ok ? 'good' : 'bad', 'CHECK ' + (ok ? 'PASS ' : 'FAIL ') + name);
  };
  const got = (el, type, fire) => {
    let seen = false;
    const h = () => { seen = true; };
    el.addEventListener(type, h);
    fire();
    el.removeEventListener(type, h);
    return seen;
  };
  const runChecks = () => {
    document.getElementById('checks').textContent = '';
    const a = document.getElementById('hover');
    const b = document.getElementById('inp');
    // Real enter/leave events don't bubble.
    const mouse = (type, Kind = MouseEvent) => () => a.dispatchEvent(new Kind(type, { bubbles: !/enter|leave/.test(type), relatedTarget: b }));
    check('mouseout to another element', got(a, 'mouseout', mouse('mouseout')));
    check('mouseleave to another element', got(a, 'mouseleave', mouse('mouseleave')));
    check('mouseover from another element', got(a, 'mouseover', mouse('mouseover')));
    check('mouseenter from another element', got(a, 'mouseenter', mouse('mouseenter')));
    check('pointerout to another element', got(a, 'pointerout', mouse('pointerout', PointerEvent)));
    check('touch pointerleave', got(a, 'pointerleave', () => a.dispatchEvent(new PointerEvent('pointerleave', { pointerType: 'touch' }))));
    check('input focus event', got(b, 'focus', () => b.focus()));
    check('input blur event', got(b, 'blur', () => b.blur()));
    check('focusout bubbles to document', got(document, 'focusout', () => { b.focus(); b.blur(); }));
    check('keydown reaches document', got(document, 'keydown', () => document.body.dispatchEvent(new KeyboardEvent('keydown', { bubbles: true }))));
    check('other window events', got(window, 'resize', () => window.dispatchEvent(new Event('resize'))));
    check('hidden is a boolean', typeof document.hidden === 'boolean');
    check('visibilityState is a string', typeof document.visibilityState === 'string');
    check('hasFocus returns a boolean', typeof document.hasFocus() === 'boolean');
    const t0 = performance.now();
    setTimeout(() => check('setTimeout fires (<200ms)', performance.now() - t0 < 200), 10);
    const r0 = performance.now();
    requestAnimationFrame(() => check('requestAnimationFrame fires (<200ms)', performance.now() - r0 < 200));
    let tf = false; const tid = setTimeout(() => { tf = true; }, 10); clearTimeout(tid);
    setTimeout(() => check('clearTimeout cancels', !tf), 80);
    let rf = false; const rid = requestAnimationFrame(() => { rf = true; }); cancelAnimationFrame(rid);
    setTimeout(() => check('cancelAnimationFrame cancels', !rf), 80);
    setTimeout((x, y) => check('setTimeout passes extra arguments', x === 1 && y === 2), 0, 1, 2);
    window.strTimerRan = false;
    setTimeout('window.strTimerRan = true', 0);
    setTimeout(() => check('setTimeout runs a string handler', window.strTimerRan), 80);
    const order = [];
    setTimeout(() => order.push('b'), 3);
    setTimeout(() => order.push('a'), 1);
    setTimeout(() => check('shorter setTimeout fires first', order.join('') === 'ab'), 80);
    let ic = 0; const iid = setInterval(() => { if (++ic === 3) clearInterval(iid); }, 5);
    setTimeout(() => check('setInterval repeats, clearInterval stops it', ic === 3), 150);
    // An uncaught error in a callback must still reach window 'error', as it does natively.
    const reaches = (name, schedule) => {
      let seen = false;
      const msg = 'probe error from ' + name;
      const h = (e) => { if (e.message?.includes(msg)) { seen = true; e.preventDefault(); } };
      window.addEventListener('error', h);
      schedule(() => { throw new Error(msg); });
      setTimeout(() => { window.removeEventListener('error', h); check(name + ' callback error reaches window error event', seen); }, 100);
    };
    reaches('setTimeout', (f) => setTimeout(f, 0));
    reaches('requestAnimationFrame', (f) => requestAnimationFrame(f));
    if (window.requestIdleCallback) {
      const i0 = performance.now();
      requestIdleCallback((d) => check('requestIdleCallback fires (<200ms) with a deadline', performance.now() - i0 < 200 && typeof d.timeRemaining === 'function'), { timeout: 100 });
      let icf = false; const icid = requestIdleCallback(() => { icf = true; }); cancelIdleCallback(icid);
      setTimeout(() => check('cancelIdleCallback cancels', !icf), 80);
    }
  };
  document.getElementById('run').onclick = runChecks;
  runChecks();

  // Manual checks.
  const inp = document.getElementById('inp');
  const hover = document.getElementById('hover');
  inp.addEventListener('blur', () => { document.getElementById('inpmsg').textContent = 'blur fired OK'; report('MANUAL input blur fired'); });
  hover.addEventListener('mouseenter', () => { hover.classList.add('on'); report('MANUAL hover enter'); });
  hover.addEventListener('mouseleave', () => { hover.classList.remove('on'); report('MANUAL hover leave'); });

  // Popups open their own realm; the script patches what window.open returns. Manual because a
  // popup can't open without a click and shouldn't spawn on page load. (Headless blocks it.)
  document.getElementById('popup').onclick = () => {
    const msg = document.getElementById('popupmsg');
    const p = window.open('', '_blank', 'width=200,height=120');
    if (!p) { msg.textContent = 'blocked by popup blocker'; return; }
    let seen = false;
    p.addEventListener('visibilitychange', () => { seen = true; });
    p.dispatchEvent(new p.Event('visibilitychange'));
    const patched = !seen; // swallowed = patched
    msg.className = patched ? 'good' : 'bad';
    msg.textContent = patched ? 'PASS: popup realm patched' : 'FAIL: popup realm not patched';
    report('MANUAL popup patched=' + patched);
    p.close();
  };
</script>
